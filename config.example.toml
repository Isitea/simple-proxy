# 전달 규칙: <수신 포트> = "<대상 호스트>:<대상 포트>"
# 이 파일을 config.toml 로 복사해서 쓴다. (config.toml 은 git 에서 제외)
#
# 수신 주소는 기본으로 listen_host 를 쓴다. 특정 규칙만 다른 주소로
# 받으려면 키에 "0.0.0.0:9000" 처럼 호스트를 함께 적는다.

listen_host = "127.0.0.1"

[forward]
9000 = "192.0.2.10:8787"
9022 = "192.0.2.10:22"
"0.0.0.0:9010" = "192.0.2.10:8010"

# 호스트명으로 나누기 (HTTP 전용)
# "app.local:9020" = "192.0.2.10:8020"

# Host 헤더 바꿔 보내기 (HTTP 전용)
# 9050 = { target = "192.0.2.10:9000", host = "app.local" }

# Host/Origin 헤더 바꿔 보내기 (HTTP 전용, localhost 만 받는 상류용)
# 7050 = { target = "127.0.0.1:7050", host = "localhost:7050", origin = "http://localhost:7050" }
